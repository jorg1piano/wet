# wet.example.yaml — the full `.wet.yaml` schema, annotated.
#
# Copy to `.wet.yaml` at your repo root and delete what you don't need.
# Everything below is optional except `project_name`. wet itself contains no
# project-specific knowledge; this file is the entire contract.
#
# `wet setup` applies it to whichever checkout you are in: the main repo at
# slot 0 (the declared base ports), a worktree at slot N.
#
# Validate a config without touching a worktree:
#   wet env populate <template> --dry-run

# ---------------------------------------------------------------------------
# Identity (required)
# ---------------------------------------------------------------------------

# Must match [a-z0-9][a-z0-9_-]* — it embeds into COMPOSE_PROJECT_NAME, so it
# has to satisfy Docker Compose's naming rules.
project_name: myapp

# The trunk: the branch new worktrees are cut from (origin/<branch> when that
# ref exists, so a worktree starts from what's on the remote rather than from
# a stale local tip), the default base for `wet pr create`, and the one branch
# wet refuses to open a PR from. Optional; defaults to "main".
main_branch: main

# ---------------------------------------------------------------------------
# Files copied into each new worktree
# ---------------------------------------------------------------------------
#
# Paths are relative to the repo root. Missing files are skipped silently so
# an optional file doesn't break the flow.
#
# Prefer `env populate` (below) over copying generated env files: a copy
# snapshots one machine's values and then drifts, while a template re-renders
# with this worktree's own ports every time.

copy:
  files:
    - .claude/settings.json
    - .claude/settings.local.json
  dirs:
    - .vscode

# ---------------------------------------------------------------------------
# Ports
# ---------------------------------------------------------------------------
#
# Every checkout holds a slot number N: the main repo is always slot 0, each
# worktree gets the lowest free slot (1, 2, 3, ...). A declared port resolves
# to `base + N*stride` — so with `base: 4000` and `stride: 10`, APP_PORT is
# 4000 in the main repo, 4010 in the first worktree, 4020 in the second. That
# is what lets several stacks run side by side. Slots are reused lowest-first
# as worktrees are popped, and a slot is only taken if its ports are also
# actually free on the host.
#
# Names must match [A-Z_][A-Z0-9_]* and must not collide with the reserved
# template fields, which are: ProjectName, Branch, BranchSafe, Slot, Pools,
# Handles.

port_stride: 10 # default stride; optional, defaults to 10

ports:
  - { name: APP_PORT, base: 4000 }
  - { name: DB_PORT, base: 5432 }
  - { name: GRPC_PORT, base: 50051 }
  - name: DEBUG_PORT
    base: 40000
    stride: 5 # per-port override of port_stride

# ---------------------------------------------------------------------------
# Pools — exclusive resources, one item per worktree
# ---------------------------------------------------------------------------
#
# Anything that can't be shared and can't be computed from a slot number:
# emulators, test-fixture snapshots, licence seats. Allocation happens in
# `wet setup`, which you run yourself from inside the worktree — `wet worktree
# create` only forks the worktree and tells you the command. The first
# unclaimed item in declared order is claimed and recorded in
# `.wet-worktrees.json`. Claims release implicitly — dropping the worktree's
# entry with `wet worktree pop` frees whatever it held, no release step to run.
#
# On exhaustion (every item claimed and no `pool_grow:` strategy for that
# pool), `wet setup` aborts with an error naming the branch holding each item.
# By then the worktree and its branch are already on disk — they were created
# by the earlier `wet worktree create` — and no state entry was recorded for
# them. Free an item by popping another worktree and re-run `wet setup`, or
# `wet worktree pop` this worktree away.
#
# Pool names must match [a-z_][a-z0-9_]*. Reachable as {{.Pools.devices}} /
# {{.Handles.devices}} in templates and $POOL_DEVICES in hooks.

pools:
  # An emulator item names an AVD as `emulator:<AVD_NAME>`, never a runtime
  # `emulator-5554` serial: the serial is assigned by adb at boot, so a pool
  # of serials fills up with items that point at dead devices after a reboot
  # and carry no way to start them again. The AVD name is durable, and it is
  # what wet boots (and what teardown reasons about). The live serial is the
  # *handle* — see .Handles below.
  devices:
    - emulator:pixel-a
    - emulator:pixel-b
    - emulator:pixel-c
  fixtures:
    - snap-alpha
    - snap-beta

# Optional: per-pool strategy for growing a pool when every item is claimed,
# instead of failing. The only strategy wet implements is `android-emulator`:
# it creates a new AVD named after the project, cold boots it, waits for it to
# come online, appends `emulator:<AVD_NAME>` to the machine-local
# `.wet.local.yaml` (never to this committed file), and claims it.
#
# A pool with no entry here — or with any other value — is not grown: it fails
# with the exhaustion error described above.
# pool_grow:
#   devices: android-emulator

# ---------------------------------------------------------------------------
# env: — the derivation layer
# ---------------------------------------------------------------------------
#
# Values are Go text/template strings. Available fields: ProjectName, Branch,
# BranchSafe (branch with slashes flattened — safe for Docker names), Slot,
# every declared port, .Pools.<name>, and .Handles.<name>.
#
# .Pools.<name> is the claimed item — the durable identity wet owns and tears
# down (`emulator:pixel-a`). .Handles.<name> is the address that item answers
# to right now, resolved at setup time (`emulator-5554`). Target commands at
# the handle; identify the resource by the item. For a pool of plain strings
# the two are identical.
#
# Entries may reference each other in any order — they resolve to a fixed
# point, not in sorted order. That is what makes this the single source of
# truth for a monorepo: derive a URL from a port ONCE here, and every
# package's template consumes the result instead of re-deriving it. A
# reference cycle or a typo is reported by key name.
#
# Anything here can be overridden per machine by a gitignored `.env.local` at
# the repo root (KEY=value lines) — so the entries below act as defaults. Put
# a LAN IP for physical-device testing there, not in this file.

env:
  DEV_HOST: "localhost" # override in .env.local for a physical device
  APP_URL: "http://{{.DEV_HOST}}:{{.APP_PORT}}"
  CALLBACK_URL: "{{.APP_URL}}/auth/callback" # derived from a derived value
  COMPOSE_PROJECT_NAME: "{{.ProjectName}}-{{.BranchSafe}}"
  FLUTTER_DEVICE: "{{.Handles.devices}}" # the live serial, not `emulator:pixel-a`

# ---------------------------------------------------------------------------
# render: — template → output pairs
# ---------------------------------------------------------------------------
#
# One entry per env file the repo needs. A monorepo lists one per package;
# each carries its own secret sources, because a backend needs the vault and a
# mobile app usually needs nothing.
#
# Rendered by `wet setup` (before hooks, so a hook that boots the stack finds
# the files already written) and by `wet env populate --all`. Add --dry-run to
# see every file that would be written for this slot without touching disk.
#
# Each target renders against its own copy of the data, so one target's
# secrets can never leak into another's output — a template that references a
# key it wasn't given fails rather than silently picking up a sibling's.
#
# secrets_from: takes files, or "-" for stdin (at most one target may use
# stdin per run). Later sources win on a key collision.

render:
  - template: .env.example.tpl
    out: .env
  # - template: backend/.env.tpl
  #   out: backend/.env
  #   secrets: backend            # a section of secrets: below
  # - template: mobile/.env.tpl
  #   out: mobile/.env
  #   secrets: mobile
  #   secrets_from: [/tmp/vault.json]

  # Editor config is a render target too, not just env files. A debugger has
  # to attach to *this* slot's port and *this* worktree's device, so a copied
  # launch.json is wrong the moment a second worktree exists. Missing parent
  # directories are created, so .vscode/ need not already be in the worktree.
  #
  # Render it rather than patching a tracked launch.json in place: `sed` plus
  # `git update-index --assume-unchanged` also hides every later edit the user
  # makes to that file. Add the rendered output to .gitignore, keep the .tpl
  # in git.
  # - template: .vscode/launch.json.tpl
  #   out: .vscode/launch.json

# ---------------------------------------------------------------------------
# secrets: — the vault, and which keys each consumer needs
# ---------------------------------------------------------------------------
#
# Optional. Without this block wet talks to no secret store at all and secrets
# arrive only through secrets_from / --secrets-from, which stays fully
# supported — this block is for the case where you would rather not maintain a
# producer script per repo.
#
# `sections` is the second dimension, and it names CONSUMERS, not storage.
# `backend` and `mobile` are labels: a render target picks one with `secrets:`,
# and that target's template gets those keys and no others. Both sections may
# name the same field — GOOGLE_CLIENT_ID is one credential whether the API or
# the app reads it — so the vault holds no per-consumer duplicates and a
# rotation is one edit in one place. Nothing in the vault records which section
# uses a value; that mapping lives here.
#
# A value is a field on `item`, "Other Item/field" for another item in the same
# vault, or a full "op://vault/item/field" when it lives somewhere else
# entirely.
#
# vault/item/account may be omitted: `wet op vault ...` asks (a picker over
# `op account list` / `op vault list`) and remembers the answer in the
# gitignored .wet.local.yaml, since which account you are signed into is a fact
# about your machine, not about the project.
#
#   wet op vault seed --input .env.development   # env file -> vault
#   wet op vault read --output .env.development  # vault -> one env file per section

# secrets:
#   store: op
#   vault: fantasy_basketball_development
#   item: fantasy
#   account: my.1password.com
#   sections:
#     backend:
#       SECRET_KEY_BASE: secret_key_base
#       GOOGLE_CLIENT_ID: google_client_id
#       GOOGLE_CLIENT_SECRET: google_client_secret
#     mobile:
#       GOOGLE_CLIENT_ID: google_client_id
#       APPLE_SERVICE_ID: apple_service_id

# ---------------------------------------------------------------------------
# Hooks
# ---------------------------------------------------------------------------
#
# Each command is rendered as a template, then run through `sh -c` with cwd at
# the worktree — so pipes, &&, and globs all work. Every value above is also
# available as a real environment variable ($APP_PORT, $POOL_DEVICES, $SLOT,
# $BRANCH_SAFE), which is what non-templatable scripts should read.
#
# A nonzero exit aborts the operation and prints the failing command.

hooks:
  post_create:
    # `render:` above already covers env files — hooks are for actions.
    - echo "slot {{.Slot}} ready at {{.APP_URL}}"

    # Same command, with secrets supplied. wet never talks to a secret store
    # itself — any command emitting a flat JSON object works. The source is
    # always explicit (`--secrets-from -`, or a path); wet never sniffs stdin,
    # because a hook inherits its parent's and a wrong guess would hang:
    #   ./scripts/wet-secrets.sh    | wet env populate ...
    #   az keyvault secret list ... | jq '...' | wet env populate ...
    # Keep that producer in a committed script rather than inline here: it is
    # then runnable on its own (`./scripts/wet-secrets.sh | jq keys`) when a
    # render fails. For 1Password there is no script to write — declare a
    # secrets: block instead (above) and the render targets fetch their own.
    # Piped keys override env: entries above, but may not override a declared
    # port (that would defeat slot allocation, and is an error).
    # - ./scripts/wet-secrets.sh | wet env populate .env.example.tpl -o .env --secrets-from -

  pre_remove:
    - docker compose down -v
    # - ./scripts/release-device.sh "$POOL_DEVICES" # the item, e.g. emulator:pixel-a

# ---------------------------------------------------------------------------
# Pull requests — `wet pr create`
# ---------------------------------------------------------------------------
#
# base resolves: --base flag → pr.base → "main".
# Without body_template, the body lists slot, ports, and pool items.

pr:
  base: main
  # body_template: |
  #   ## Summary
  #
  #   Worktree slot {{.Slot}}, ports: {{range $k, $v := .Ports}}{{$k}}={{$v}} {{end}}
