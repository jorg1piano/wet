# wet.example.yaml — the full `.wet.yaml` schema, annotated.
#
# Copy to `.wet.yaml` at your repo root and delete what you don't need.
# Everything below is optional except `project_name`. wet itself contains no
# project-specific knowledge; this file is the entire contract.
#
# `wet setup` applies it to whichever checkout you are in: the main repo at
# slot 0 (the declared base ports), a worktree at slot N.
#
# The point of this file is that it is the ONLY inventory. It answers, in one
# place: which env files this repo generates, which keys each one carries,
# which of those keys are secrets, where those secrets live, and which values
# vary per worktree. There is no checked-in `.env.tpl` holding a second,
# drifting copy of that list.
#
# Check a config without writing anything:
#   wet env explain          # what each output contains, and where from
#   wet env pull --dry-run   # resolve and validate everything, write nothing

# ---------------------------------------------------------------------------
# Identity (required)
# ---------------------------------------------------------------------------

# Must match [a-z0-9][a-z0-9_-]* — it embeds into COMPOSE_PROJECT_NAME, so it
# has to satisfy Docker Compose's naming rules.
project_name: myapp

# The trunk: the branch new worktrees are cut from. wet uses the local branch
# when it contains every commit in origin/<branch>, and the cached origin ref
# otherwise. create does not fetch. This is also the default PR base and a branch
# wet refuses to open a PR from. Optional; defaults to "main".
main_branch: main

# Optional. What `wet worktree create` / `wet worktree mount` should open after
# adding the checkout. Valid values: `tmux` (default) or `none`. Put
# `multiplexer: none` in .wet.local.yaml when another tool like Herdr manages
# panes/tabs for you.
multiplexer: tmux
# After a reboot, warm every currently claimed worktree with:
#   wet slot warm --all --headless
# Add --reset when you also want each slot cleaned before it starts.

# ---------------------------------------------------------------------------
# Files copied into each new worktree
# ---------------------------------------------------------------------------
#
# Paths are relative to the repo root. Missing files are skipped silently so
# an optional file doesn't break the flow.
#
# Prefer an `outputs:` entry (below) over copying a generated env file: a copy
# snapshots one machine's values and then drifts, while a declared output is
# regenerated with this worktree's own ports every time.

copy:
  files:
    - .claude/settings.json
    - .claude/settings.local.json
  dirs:
    - .vscode

# ---------------------------------------------------------------------------
# Ports
# ---------------------------------------------------------------------------
#
# Every checkout holds a slot number N: the main repo is always slot 0, each
# worktree gets the lowest free slot (1, 2, 3, ...). A declared port resolves
# to `base + N*stride` — so with `base: 4000` and `stride: 10`, APP_PORT is
# 4000 in the main repo, 4010 in the first worktree, 4020 in the second. That
# is what lets several stacks run side by side. Slots are reused lowest-first
# as worktrees are popped, and a slot is only taken if its ports are also
# actually free on the host.
# With ports declared, slots must stay below cluster_slots. The default 10
# allows main plus nine worktrees. A full band or a port above 65535 fails
# setup; no allocation spills into the next clone's band.
#
# Names must match [A-Z_][A-Z0-9_]* and must not collide with the reserved
# template fields, which are: ProjectName, Branch, BranchSafe, Slot, Pools,
# Handles.

port_stride: 10 # default stride; optional, defaults to 10

# Slots spread ports out inside ONE checkout. What nothing spreads apart is
# two clones of this repo on the same machine: both start at slot 0, both
# resolve to the declared bases, and the second stack to boot dies on "port
# is already allocated". A port CLUSTER is the band one clone owns across all
# of its worktrees, and `wet port-cluster next` claims a free one.
#
# cluster_slots is how wide that band is — how many slots' worth of room a
# clone gets before its ports would reach the next clone's. It is committed
# here rather than left per-machine because every clone has to agree on the
# width, or their bands interleave. Each port shifts by its own stride, so
# with the ports below: APP_PORT moves 100 per cluster, DEBUG_PORT (stride 5)
# moves 50.
#
#   cluster 0 -> APP_PORT 4000 .. 4090
#   cluster 1 -> APP_PORT 4100 .. 4190
#
# Which cluster THIS clone took is a fact about one machine, so it belongs in
# the gitignored .wet.local.yaml, never here — committing it would hand the
# whole team one clone's answer:
#
#   # .wet.local.yaml
#   port_cluster: 1

cluster_slots: 10 # slots reserved per cluster; optional, defaults to 10

ports:
  - { name: APP_PORT, base: 4000 }
  - { name: DB_PORT, base: 5432 }
  - { name: GRPC_PORT, base: 50051 }
  - name: DEBUG_PORT
    base: 40000
    stride: 5 # per-port override of port_stride

# Optional. Normal wet setup skips slots whose host ports are already bound,
# catching stale untracked stacks before Docker reports "port is allocated".
# Set slot_pool when released slots intentionally keep warm resources bound to
# their ports — for example a DB container/volume that survives worktree pop.
# A busy port is reusable only when Docker reports this slot's own Compose
# project as its owner. Other listeners still cause the slot to be skipped.
# Slots with warm containers are tried before cold ones.
# Setup runs hooks.slot_reset the first time a checkout claims a slot (skip
# with --no-reset); slot_start stays a separate step.
slot_pool: false

# ---------------------------------------------------------------------------
# Pools — exclusive resources, one item per worktree
# ---------------------------------------------------------------------------
#
# Anything that can't be shared and can't be computed from a slot number:
# emulators, test-fixture snapshots, licence seats. Allocation happens in
# `wet setup`, which you run yourself from inside the worktree — `wet worktree
# create` only forks the worktree and tells you the command. The first
# unclaimed item in declared order is claimed and recorded in
# `.wet-worktrees.json`. Claims release implicitly — dropping the worktree's
# entry with `wet worktree pop` frees whatever it held, no release step to run.
#
# On exhaustion (every item claimed and no `pool_grow:` strategy for that
# pool), `wet setup` aborts with an error naming the branch holding each item.
# By then the worktree and its branch are already on disk — they were created
# by the earlier `wet worktree create` — and no state entry was recorded for
# them. Free an item by popping another worktree and re-run `wet setup`, or
# `wet worktree pop` this worktree away.
#
# Pool names must match [a-z_][a-z0-9_]*. Reachable as {{.Pools.devices}} /
# {{.Handles.devices}} in env: templates, as `from: Pools.devices` in an
# output, and as $POOL_DEVICES in hooks.

pools:
  # An emulator item names an AVD as `emulator:<AVD_NAME>`, never a runtime
  # `emulator-5554` serial: the serial is assigned by adb at boot, so a pool
  # of serials fills up with items that point at dead devices after a reboot
  # and carry no way to start them again. The AVD name is durable, and it is
  # what wet boots (and what teardown reasons about). The live serial is the
  # *handle* — see .Handles below.
  devices:
    - emulator:pixel-a
    - emulator:pixel-b
    - emulator:pixel-c
  fixtures:
    - snap-alpha
    - snap-beta

# Optional: per-pool strategy for growing a pool when every item is claimed,
# instead of failing. The only strategy wet implements is `android-emulator`:
# it reserves a new AVD named after the project, appends `emulator:<AVD_NAME>`
# to the machine-local `.wet.local.yaml` (never to this committed file), and
# claims it. Setup creates and boots the AVD after the allocation lock is
# released.
#
# A pool with no entry here fails on exhaustion. An unknown strategy or an
# entry naming an undeclared pool fails when the config loads.
#
# A pool with a strategy may start EMPTY: `devices: []` plus the strategy below
# is the bootstrap case, and wet creates the first AVD on the first `wet setup`:
# a clone of an AVD the machine already has, or, with none, the newest installed
# phone system image for the host ABI — downloading android-36 google_apis via
# `sdkmanager` when no image is installed either.
# An empty pool without a strategy is rejected at load — nothing can ever fill
# it, so it could only fail later at allocation, and failing at load names the
# file to fix.
# pool_grow:
#   devices: android-emulator

# Optional: where a pool's items come from. `project` (the default) is the
# pools: list above. `machine` draws from one emulator pool every wet project
# on this machine shares, kept in ~/.local/state/wet/machine.json, and needs
# `pool_grow: android-emulator` so wet can add emulators to it (named
# wet-avd-N). A slot gets back the emulator it used last when that one is
# free. Each project's claims stay in its own .wet-worktrees.json, and
# `wet machine list` shows who holds which emulator.
# pool_scope:
#   devices: machine

# ---------------------------------------------------------------------------
# env: — the derivation layer
# ---------------------------------------------------------------------------
#
# Ordinary, non-secret values. Everything here is committed as written, so
# nothing that must not be read from this file belongs in it — credentials go
# under `secrets:` below, and a name may not appear in both.
#
# Values are Go text/template strings. Available fields: ProjectName, Branch,
# BranchSafe (branch with slashes flattened — safe for Docker names), Slot,
# every declared port, .Pools.<name>, and .Handles.<name>.
#
# .Pools.<name> is the claimed item — the durable identity wet owns and tears
# down (`emulator:pixel-a`). .Handles.<name> is the address that item answers
# to right now, resolved at setup time (`emulator-5554`). Target commands at
# the handle; identify the resource by the item. For a pool of plain strings
# the two are identical.
#
# .AllPools.<name> and .AllHandles.<name> are the LIST forms: every item this
# worktree claims from the pool, primary first. A worktree claims one device by
# default, so these are one entry long until `wet mobile add` claims a second
# or `wet mobile ensure --count 4` claims enough for a multi-actor scenario.
# The scalar forms
# above always mean the primary, so a config rendering a single device never
# has to change. Range over the list form when a value must cover them all:
#
#   ALL_DEVICE_IDS: "{{range $i, $h := .AllHandles.devices}}{{if $i}},{{end}}{{$h}}{{end}}"
#
# Entries may reference each other in any order — they resolve to a fixed
# point, not in sorted order. That is what makes this the single source of
# truth for a monorepo: derive a URL from a port ONCE here, and every output
# consumes the result instead of re-deriving it. A reference cycle or a typo
# is reported by key name.
#
# Anything here can be overridden per machine by a gitignored `.env.local` at
# the repo root (KEY=value lines) — so the entries below act as defaults. Put
# a LAN IP for physical-device testing there, not in this file. `.env.local`
# can NOT override a secret: a secret reaches a file only through the store or
# its declared default, so a stray local line cannot quietly become the
# credential your app runs with.

env:
  DEV_HOST: "localhost" # override in .env.local for a physical device
  APP_URL: "http://{{.DEV_HOST}}:{{.APP_PORT}}"
  CALLBACK_URL: "{{.APP_URL}}/auth/callback" # derived from a derived value
  COMPOSE_PROJECT_NAME: "{{.ProjectName}}-{{.BranchSafe}}"
  FLUTTER_DEVICE: "{{.Handles.devices}}" # the live serial, not `emulator:pixel-a`
  SENTRY_ENV: "dev"

# ---------------------------------------------------------------------------
# outputs: — the env files this repo generates
# ---------------------------------------------------------------------------
#
# One entry per generated file. A monorepo lists one per package. There is no
# template to write: for a dotenv file wet already knows every value, so the
# only thing left to declare is which of them the file carries and under what
# key — and declaring that here, rather than in a checked-in `.env.tpl`, is
# what keeps a single inventory. A key not listed is simply not in the file.
#
# Written by `wet setup` (before hooks, so a hook that boots the stack finds
# the files already there) and regenerated on demand by `wet env pull`, which
# does no lifecycle work at all: no slot, no ports, no pools, no hooks.
#
#   wet env pull              every output
#   wet env pull mobile       only that one
#   wet env pull --dry-run    resolve and validate, write nothing
#   wet env explain           what each output holds, without the values
#
# Every requested output is resolved and validated before any of them is
# written, so a typo in the second file cannot leave the first one updated and
# the app half-configured.
#
# Per entry:
#   name      required, unique, lowercase. The CLI identifier: `wet env pull
#             <name>`, `wet env push <name>`.
#   out       required, relative to the checkout, must not escape it. Missing
#             parent directories are created. No two outputs may write the
#             same path — the loser's keys would silently vanish.
#   format    required. `dotenv`, `properties`, or `file` for raw provider bytes.
#   secret    required for format: file. Names a secrets.definitions entry.
#   mode      optional octal string. Defaults to "0600": a generated env file
#             may carry secrets and outlives the command that wrote it.
#   include   ordinary values, ports, and reserved fields, keeping their own
#             name as the output key.
#   secrets   names from secrets.definitions below, keeping their own name.
#             Definitions reach an output only when explicitly selected here,
#             through values.<key>.secret, or through a file output's secret:.
#   values    renamed and literal keys, emitted in the order written here.
#             `from:` reads an ordinary value, port, or Pools./Handles. entry;
#             `literal:` emits a fixed scalar; `secret:` selects a definition;
#             `file:` inserts a file output's absolute path and pulls that file.
#             Exactly one source is required per key.
#   on_demand optional. Keeps the output out of the sweep: `wet setup` and
#             a bare `wet env pull` skip it, and only
#             `wet env pull <name>` generates it. A values.file dependency also
#             selects an on-demand file. For the files that are not
#             this checkout's at all — a deploy environment's dotenv, whose
#             credentials belong to a running system and have no business
#             being fetched onto every developer's disk. `wet env explain`
#             still lists it, marked, because it is part of the inventory.
#
# Secrets are not reachable through values.from. Select them explicitly with
# values.<key>.secret when the consumer needs a different key name.
# Any output key declared twice is a load error.

outputs:
  - name: backend
    out: backend/.env.dev
    format: dotenv
    include:
      - DEV_HOST
      - APP_PORT
      - DB_PORT
      - APP_URL
      - CALLBACK_URL
      - SENTRY_ENV
    # Uncomment together with the secrets: block below. Each name here must be
    # defined there, and a definition NOT named here is invisible to this file.
    # secrets:
    #   - SECRET_KEY_BASE
    #   - GOOGLE_CLIENT_ID
    #   - GOOGLE_CLIENT_SECRET
    #   - SENTRY_DSN

  - name: mobile
    out: mobile/.env
    format: dotenv
    # Nothing secret in it, so the usual owner-only default is unhelpful here:
    # mode: "0644"
    #
    # A client app's config is public by definition — it ships inside the
    # bundle — so this output selects no secrets at all. `values:` renames
    # wet's names into the ones the app expects.
    values:
      host:
        from: DEV_HOST
      port:
        from: GRPC_PORT
      webBaseUrl:
        from: APP_URL
      oidcClientId:
        literal: myapp-mobile
      oidcRedirectUri:
        literal: "myapp://auth/callback"

  # Any provider file can be downloaded in the same pull. Add a BUNDLE
  # definition under secrets.definitions with field: bundle.bin or a full ref:.
  #
  # - name: bundle
  #   out: private/bundle.bin
  #   format: file
  #   secret: BUNDLE
  #   on_demand: true
  # - name: bundle-config
  #   out: config/bundle.properties
  #   format: properties
  #   values:
  #     bundle.path: {file: bundle}
  #
  # Pulling bundle-config also downloads bundle. Defaults are literal file
  # content. No file extension has special behavior. Add both paths to .gitignore.

  # A deploy environment. It is an output like any other — one inventory, one
  # place to read what the app is configured with — but it is `on_demand:`, so
  # a worktree never fetches these credentials, and it is generated straight
  # into whatever consumes it rather than onto a disk:
  #
  #   wet env pull deploy-staging --env staging --secrets required --stdout \
  #     | fly secrets import --app myapp-staging
  #
  # --secrets required is what keeps a development placeholder out of a running
  # system: under the default `fallback` policy an unreachable store writes
  # each declared `default:`, and pushing an empty string over a real
  # credential is the mistake this path must never make.
  #
  # The per-environment values are literals here, in git, rather than fields in
  # the vault: a hostname is not a credential, and a value nobody can diff is
  # a value nobody can review. Only the vault varies with --env.
  #
  # - name: deploy-staging
  #   out: deploy/.env.staging
  #   format: dotenv
  #   on_demand: true
  #   values:
  #     APP_HOST:
  #       literal: staging.example.com
  #   secrets:
  #     - SECRET_KEY_BASE
  #     - SENTRY_DSN

  # Editor config usually needs NO output of its own. Point it at the env file
  # wet already writes, and it stops varying per worktree:
  #
  #   // .vscode/launch.json — plain, committed, identical everywhere
  #   {"configurations": [{
  #     "name": "app (dev)", "request": "launch", "type": "dart",
  #     "args": ["--dart-define-from-file", "mobile/.env"]
  #   }]}
  #
  # VS Code's node/python debuggers take `"envFile"` for the same job. One
  # indirection, and the file with the per-worktree values is the generated
  # one — which is where they belong, since the app reads them too.
  #
  # Leave the host, port, and device OUT of launch.json entirely. A pinned
  # port is wrong in every worktree but one, and a committed device id sends
  # everyone else's run at hardware they don't have.
  #
  # Declare an output for editor config only when the tool cannot read an env
  # file. Then it must be gitignored: `wet setup` runs in the main checkout
  # too, so a tracked out: is overwritten and left dirty on every run. Beware
  # `.gitignore` with `.vscode/` — git cannot re-include a file under an
  # excluded directory, so you need `.vscode/*` (not `.vscode/`) plus a `!`
  # line, or `copy:` the directory instead.

# ---------------------------------------------------------------------------
# secrets: — every credential, declared once
# ---------------------------------------------------------------------------
#
# Optional. Without this block wet talks to no secret store at all and every
# output is made of ordinary values.
#
# A definition is a NAME plus a PLACE — never a value. No plaintext secret
# belongs in this file. Each credential is defined once and shared by name:
# GOOGLE_CLIENT_ID is one credential whether the API or a deployment reads it,
# so the store holds no per-consumer duplicates and a rotation is one edit.
# Who may see it is decided by the outputs above, not here.
#
# A definition name may not collide with a port, a reserved field, or an env:
# key. That last one matters: if a value can come from either place the output
# key is ambiguous, and worse, a store value could shadow an allocated port
# and hand two worktrees the same one. So a provider key with a store field
# lives ONLY here — its dev fallback goes in `default:`, not in env:.
#
# Per definition:
#   field     the field on `item`. Required unless `ref:` is given.
#   default   the fallback used under `policy: fallback`. A pointer in spirit:
#             an OMITTED default means "this must come from the store or fail",
#             while `default: ''` means "this provider is deliberately not
#             configured locally, and empty is the right value". They are
#             different, and the empty one still renders as `KEY=`.
#   vault     per-secret override of the block-level vault (which itself
#             comes from .wet.local.yaml — see below).
#   item      per-secret override of the block-level item.
#   ref       a full provider reference for a secret that lives somewhere else:
#             "op://vault/item/field" for 1Password. Mutually exclusive with
#             vault/item/field.
#
# With `store: op`, a reference resolves only once BOTH an item and a vault
# are named, and both belong here, in .wet.yaml:
#
#   item     which item the fields sit on is a fact about the project, and
#   vault    so is which vault holds it — everyone who clones the repo needs
#            the same answer.
#   account  the exception: which account you are signed into is a fact about
#            your machine, so it goes in the gitignored .wet.local.yaml.
#
# .wet.local.yaml can override the vault too, the way it can override any key
# — but that is an override, not where the value lives.
#
# Leave the item out and `policy: fallback` treats the unresolvable reference
# as a store failure like any other: every secret quietly falls back to its
# default: and the generated file looks configured when it is not.
#
# So the machine-local half is usually a .wet.local.yaml holding only:
#
#   secrets:
#     account: my.1password.com
#
# When one repo has more than one deploy environment — staging, production,
# sandbox — the definitions do not change: the same keys, the same fields, the
# same item, in a different vault per environment. Say so with `vaults:`
# instead of `vault:` (the two are mutually exclusive), here beside the
# definitions:
#
#   secrets:
#     vaults:
#       - name: myapp_staging
#         env: staging
#       - name: myapp_production
#         env: production
#     default_env: staging
#
# `default_env` is which one a plain `wet env pull` reads, and is required as
# soon as there is more than one vault — wet will not guess which environment
# a command meant. Any single run may say otherwise:
#
#   wet env pull --env production
#   wet env explain --env production
#   wet env push backend --from backend/.env.prod --env production
#
# Because .wet.local.yaml layers per checkout, `default_env` is also how ONE
# worktree works against staging while the rest of the machine stays on the
# default. `wet setup`, `wet worktree create` and `wet mobile setup` have no
# --env for that reason: they configure a checkout that lives on, so the
# environment belongs in its .wet.local.yaml rather than in a transient flag.
#
# Two things do NOT follow the environment:
#
#   item     the same item name must exist in every vault. Where it genuinely
#            differs, give that definition its own item: or a full ref:.
#   vault    a definition's own vault: or ref: names its own place, so --env
#   ref      does not move it. `wet env explain` marks those destinations
#            "same in every environment".
#
# Moving values in the other direction — a dotenv file back into the store:
#
#   wet env push backend --from backend/secrets.import.env --dry-run
#   wet env push backend --from backend/secrets.import.env
#
# Push is authorized by declaration: only names defined here AND selected by
# the named output are written, everything else in the file is ignored, and a
# value equal to that secret's `default:` is refused as a placeholder unless
# you pass --include-defaults. There is no flag that lets an undeclared key
# reach the store.

# secrets:
#   # The secret manager. `op` reads 1Password. `env_file` reads values from
#   # the `.env` in the checkout of `main_branch` on this machine, which is
#   # useful for copying development secrets into new worktrees without another
#   # 1Password prompt. Keep `op` for repos that should read the real vault.
#   store: op
#   # Optional override for non-main worktrees. May be any supported provider,
#   # including `op`; `env_file` means "use the main-branch checkout's .env".
#   worktree_store: env_file
#
#   # What happens when the store cannot answer. Defaults to `fallback`.
#   #
#   #   required   the store must answer for every selected secret. A declared
#   #              default does NOT paper over a store failure. For strict repos
#   #              and for CI with an authenticated service account.
#   #   fallback   try the store; on a missing client, missing auth, missing
#   #              item, or missing field, use the secret's `default:`. A secret
#   #              with neither is an error. wet names every fallback out loud —
#   #              silence here would let an empty SENTRY_DSN read as "error
#   #              reporting is configured" right up until it isn't.
#   #   disabled   never contact the store; defaults must satisfy everything.
#   #              For offline work and deterministic tests.
#   #
#   # Override for one run with:
#   #   wet env pull --secrets=required|fallback|disabled
#   policy: fallback
#
#   # The vault and the item are project facts and belong here. Only account:
#   # is machine-local — see the .wet.local.yaml snippet above. Use vaults:
#   # instead of vault: when the repo has more than one deploy environment.
#   vault: myapp_development
#   item: backend-development
#
#   definitions:
#     SECRET_KEY_BASE:
#       field: secret_key_base
#       default: 'dev-only-secret-key-base-do-not-use-outside-local-dev'
#     GOOGLE_CLIENT_ID:
#       field: google_client_id
#       default: ''            # deliberately unset locally: sign-in is simply off
#     GOOGLE_CLIENT_SECRET:
#       field: google_client_secret
#       default: ''
#     SENTRY_DSN:
#       field: sentry_dsn
#       default: ''
#     # No default at all: this one must come from the store, and a checkout
#     # that cannot reach it fails loudly instead of booting misconfigured.
#     # vault:/item: override the block-level destination for one secret —
#     # "payments lives in its own vault" is a fact about the project. Such an
#     # override does not follow --env: it names its own place in every
#     # environment, and `wet env explain` marks it as such.
#     STRIPE_SECRET_KEY:
#       field: stripe_secret_key
#       vault: myapp_payments
#       item: payments-development
#     # A secret that lives somewhere else entirely is addressed whole, and
#     # then field:/vault:/item: must be left off.
#     RELEASE_COOKIE:
#       ref: op://shared_infra/release/cookie

# ---------------------------------------------------------------------------
# Hooks
# ---------------------------------------------------------------------------
#
# Each command is rendered as a template, then run through `sh -c` with cwd at
# the worktree — so pipes, &&, and globs all work. Every ordinary value above
# is also available as a real environment variable ($APP_PORT, $POOL_DEVICES,
# $SLOT, $BRANCH_SAFE), which is what non-templatable scripts should read.
# Pools come in both shapes: $POOL_DEVICES / $POOL_HANDLE_DEVICES are the
# primary device, and $POOL_DEVICES_ALL / $POOL_HANDLE_DEVICES_ALL are every
# device this worktree claims, space-separated, primary first — one entry
# until `wet mobile add` claims another, or `wet mobile ensure --count N`
# claims enough for a multi-actor scenario.
# Secrets are not exported to hooks: they reach the files that selected them
# and nothing else.
#
# Hooks run AFTER every declared output has been written, so a hook that boots
# the stack finds the env files already on disk.
#
# A nonzero exit aborts the operation and prints the failing command.

hooks:
  post_create:
    # `outputs:` above already covers env files — hooks are for actions that
    # are safe every time `wet setup` is re-run.
    - echo "slot {{.Slot}} allocated at {{.APP_URL}}"

  # Slot lifecycle hooks are run explicitly with `wet slot <verb>`. They are
  # for projects that keep expensive resources warm per slot: a DB container,
  # an emulator, a fixture checkout, etc. wet owns the slot/device/port
  # bookkeeping; the project defines what "clean", "started" and "rebuilt"
  # mean for its stack.
  slot_reset:
    # Reset reusable state here: drop/recreate the DB schema, uninstall the
    # Android app from the claimed emulator, restore fixtures, re-apply adb
    # reverses. Run on acquire/start, not on release, so a failed cleanup can
    # be fixed before the next task uses the slot.
    # - ./scripts/reset-db-schema.sh
    # - 'adb -s "$POOL_HANDLE_DEVICES" uninstall com.example.app >/dev/null 2>&1 || true'
    # - wet mobile reverse-tcp

  slot_start:
    # Start this checkout's runtime. If a container bind-mounts the worktree,
    # recreate that container when a slot moves to a different branch.
    - docker compose up -d

  slot_stop:
    # Stop worktree-specific runtime while keeping warm slot resources alive.
    - docker compose stop || true

  slot_rebuild:
    # Slow-path recovery for a dirty slot.
    - docker compose down -v
    - docker compose up -d

  slot_doctor:
    - docker compose ps

  slot_warm:
    # Boot an UNCLAIMED slot's slot-stable services, so the next checkout to
    # claim it finds its DB already up. `wet slot warm --spare N` runs this
    # once per spare slot it warms, from the main checkout, with that slot's
    # env exported and $WET_ENV_FILE naming a rendered copy of the slot's
    # .env.worktree. Read that file instead of ./.env.worktree, which is
    # slot 0's. Start nothing that bind-mounts the checkout: it would mount
    # main. Needs slot_pool: true.
    - docker compose --env-file "$WET_ENV_FILE" up -d --wait db

  pre_remove:
    # Release-time teardown. Keep this small: with pooled slots, prefer
    # `slot_stop` for runtime shutdown and `slot_reset` before the next use.
    - docker compose stop || true
    # - ./scripts/release-device.sh "$POOL_DEVICES" # the item, e.g. emulator:pixel-a
    #
    # Stopping a claimed emulator is a project decision. In a warm slot pool,
    # leave it running and uninstall the app in `slot_reset` instead.
    # - 'for h in $POOL_HANDLE_DEVICES_ALL; do case "$h" in emulator-*) adb -s "$h" emu kill ;; esac; done; true'

# ---------------------------------------------------------------------------
# Pull requests — `wet pr create`
# ---------------------------------------------------------------------------
#
# base resolves: --base flag, then pr.base, then main_branch, then "main".
# Without body_template, the body lists slot, ports, and pool items.

pr:
  base: main
  # body_template: |
  #   ## Summary
  #
  #   Worktree slot {{.Slot}}, ports: {{range $k, $v := .Ports}}{{$k}}={{$v}} {{end}}
