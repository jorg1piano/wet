# The group catalog: what "google" or "apple" means when you scaffold it.
#
# Embedded in the wet binary and never written into a consuming repo — a copy
# in every project is a copy that goes stale, and these definitions are facts
# about the providers, not about any one app. Adding a group is a block here,
# in wet's own repo, so every project gets it on upgrade.
#
# Per key:
#   default  the value written into `env:`. Empty means "a real secret goes
#            here"; a Go template means it is derived from another value.
#   secret   the vault field the value lives in. Present => the key is also
#            added to a secrets: section. Absent => the key is derived or a
#            safe dev default, and the vault never sees it.
#
# A derived value MUST NOT carry `secret:`. A redirect URI is built from the
# worktree's own public URL, so storing one would pin every checkout to a
# single URL — the exact bug this catalog exists to prevent.

core:
  description: App-level basics every service needs
  env:
    SECRET_KEY_BASE:
      default: 'dev-only-secret-key-base-do-not-use-outside-local-dev-0000000000'
      secret: secret_key_base
    ADMIN_EMAILS:
      secret: admin_emails

google:
  description: Google OAuth (sign-in)
  env:
    GOOGLE_CLIENT_ID:
      secret: google_client_id
    GOOGLE_CLIENT_SECRET:
      secret: google_client_secret
    GOOGLE_REDIRECT_URI:
      default: '{{.HYDRA_PUBLIC_URL}}/callback/google'

apple:
  description: Sign in with Apple
  env:
    APPLE_SERVICE_ID:
      secret: apple_service_id
    APPLE_TEAM_ID:
      secret: apple_team_id
    APPLE_KEY_ID:
      secret: apple_key_id
    APPLE_PRIVATE_KEY_PEM_BASE64:
      secret: apple_private_key_pem_base64
    APPLE_REDIRECT_URI:
      default: '{{.HYDRA_PUBLIC_URL}}/callback/apple'

sentry:
  description: Sentry error reporting
  env:
    SENTRY_DSN:
      secret: sentry_dsn
    SENTRY_ENV:
      default: 'dev'

postmark:
  description: Postmark transactional email
  env:
    POSTMARK_API_KEY:
      secret: postmark_api_key

stripe:
  description: Stripe payments
  env:
    STRIPE_SECRET_KEY:
      secret: stripe_secret_key
    STRIPE_WEBHOOK_SECRET:
      secret: stripe_webhook_secret
    STRIPE_PUBLISHABLE_KEY:
      secret: stripe_publishable_key
